<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA A2A AI Robot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🤖 NEXA A2A AI</h1>
    <p>आपका अपना स्मार्ट AI रोबोट</p>

    <div class="robot">🤖</div>
    <div id="status">रोबोट तैयार है</div>

    <div id="chat">
      <div class="bot-message">
        नमस्ते! मैं NEXA हूँ। मुझसे कुछ भी पूछिए।
      </div>
    </div>

    <div class="controls">
      <input id="question" type="text"
        placeholder="अपना सवाल लिखिए...">
      <button id="send">भेजें</button>
      <button id="mic">🎤</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
